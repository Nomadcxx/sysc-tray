name: CI
on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs for the same branch or PR so a burst of pushes does
# not queue a full build each.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The D-Bus integration suite skips silently when dbus-daemon is missing,
      # so install it or the suite would pass without ever exercising them.
      - name: Install dbus
        run: sudo apt-get update && sudo apt-get install -y dbus
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: verify modules
        run: go mod verify
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: build
        run: go build ./...